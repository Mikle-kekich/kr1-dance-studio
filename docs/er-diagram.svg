<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="560" viewBox="0 0 1410 560" font-family="Consolas, 'Courier New', monospace">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="30" font-size="20" font-weight="bold" fill="#222">ER-диаграмма базы данных dance_studio (PostgreSQL) — вариант 89, танцевальная студия</text>
<rect x="30" y="100" width="350" height="188" rx="6" fill="#ffffff" stroke="#2f6fbd" stroke-width="2"/>
<path d="M30 100 h350 v34 h-350 z" fill="#2f6fbd"/>
<text x="42" y="116" font-size="16" font-weight="bold" fill="#fff">clients</text>
<text x="42" y="130" font-size="11" fill="#fff">Клиенты студии</text>
<text x="40" y="152" font-size="12" font-weight="bold" fill="#b8860b">PK</text>
<text x="74" y="152" font-size="13" font-weight="bold" fill="#222">id</text>
<text x="215" y="152" font-size="12" fill="#555">BIGSERIAL</text>
<rect x="31" y="160" width="348" height="24" fill="#f4f6f8"/>
<text x="74" y="176" font-size="13" fill="#222">full_name</text>
<text x="215" y="176" font-size="12" fill="#555">VARCHAR(100) NOT NULL</text>
<text x="40" y="200" font-size="12" font-weight="bold" fill="#2f6fbd">UQ</text>
<text x="74" y="200" font-size="13" fill="#222">phone</text>
<text x="215" y="200" font-size="12" fill="#555">VARCHAR(20) NOT NULL</text>
<rect x="31" y="208" width="348" height="24" fill="#f4f6f8"/>
<text x="40" y="224" font-size="12" font-weight="bold" fill="#2f6fbd">UQ</text>
<text x="74" y="224" font-size="13" fill="#222">email</text>
<text x="215" y="224" font-size="12" fill="#555">VARCHAR(100) NOT NULL</text>
<text x="74" y="248" font-size="13" fill="#222">birth_date</text>
<text x="215" y="248" font-size="12" fill="#555">DATE NOT NULL</text>
<rect x="31" y="256" width="348" height="24" fill="#f4f6f8"/>
<text x="74" y="272" font-size="13" fill="#222">registered_at</text>
<text x="215" y="272" font-size="12" fill="#555">TIMESTAMP NOT NULL</text>
<text x="30" y="306" font-size="11" fill="#666">CHECK: phone ~ '+[0-9]{11,15}', формат email,</text>
<text x="30" y="321" font-size="11" fill="#666">birth_date &gt;= 1900-01-01</text>
<rect x="530" y="70" width="350" height="236" rx="6" fill="#ffffff" stroke="#b5541c" stroke-width="2"/>
<path d="M530 70 h350 v34 h-350 z" fill="#b5541c"/>
<text x="542" y="86" font-size="16" font-weight="bold" fill="#fff">enrollments</text>
<text x="542" y="100" font-size="11" fill="#fff">Записи на занятия (основная сущность)</text>
<text x="540" y="122" font-size="12" font-weight="bold" fill="#b8860b">PK</text>
<text x="574" y="122" font-size="13" font-weight="bold" fill="#222">id</text>
<text x="715" y="122" font-size="12" fill="#555">BIGSERIAL</text>
<rect x="531" y="130" width="348" height="24" fill="#f4f6f8"/>
<text x="540" y="146" font-size="12" font-weight="bold" fill="#b5541c">FK</text>
<text x="574" y="146" font-size="13" fill="#222">client_id</text>
<text x="715" y="146" font-size="12" fill="#555">BIGINT NOT NULL</text>
<text x="540" y="170" font-size="12" font-weight="bold" fill="#b5541c">FK</text>
<text x="574" y="170" font-size="13" fill="#222">class_id</text>
<text x="715" y="170" font-size="12" fill="#555">BIGINT NOT NULL</text>
<rect x="531" y="178" width="348" height="24" fill="#f4f6f8"/>
<text x="574" y="194" font-size="13" fill="#222">status</text>
<text x="715" y="194" font-size="12" fill="#555">VARCHAR(20) NOT NULL</text>
<text x="574" y="218" font-size="13" fill="#222">price</text>
<text x="715" y="218" font-size="12" fill="#555">NUMERIC(10,2) NOT NULL</text>
<rect x="531" y="226" width="348" height="24" fill="#f4f6f8"/>
<text x="574" y="242" font-size="13" fill="#222">paid</text>
<text x="715" y="242" font-size="12" fill="#555">BOOLEAN NOT NULL</text>
<text x="574" y="266" font-size="13" fill="#222">note</text>
<text x="715" y="266" font-size="12" fill="#555">VARCHAR(500)</text>
<rect x="531" y="274" width="348" height="24" fill="#f4f6f8"/>
<text x="574" y="290" font-size="13" fill="#222">created_at</text>
<text x="715" y="290" font-size="12" fill="#555">TIMESTAMP NOT NULL</text>
<text x="530" y="324" font-size="11" fill="#666">CHECK: status IN (CREATED, CONFIRMED, COMPLETED, CANCELLED)</text>
<text x="530" y="339" font-size="11" fill="#666">CHECK: price &gt;= 0; CONFIRMED/COMPLETED =&gt; paid</text>
<text x="530" y="354" font-size="11" fill="#666">UNIQUE INDEX (client_id, class_id) WHERE status &lt;&gt; 'CANCELLED'</text>
<rect x="1030" y="100" width="350" height="284" rx="6" fill="#ffffff" stroke="#2d8a5b" stroke-width="2"/>
<path d="M1030 100 h350 v34 h-350 z" fill="#2d8a5b"/>
<text x="1042" y="116" font-size="16" font-weight="bold" fill="#fff">dance_classes</text>
<text x="1042" y="130" font-size="11" fill="#fff">Занятия (расписание)</text>
<text x="1040" y="152" font-size="12" font-weight="bold" fill="#b8860b">PK</text>
<text x="1074" y="152" font-size="13" font-weight="bold" fill="#222">id</text>
<text x="1215" y="152" font-size="12" fill="#555">BIGSERIAL</text>
<rect x="1031" y="160" width="348" height="24" fill="#f4f6f8"/>
<text x="1074" y="176" font-size="13" fill="#222">title</text>
<text x="1215" y="176" font-size="12" fill="#555">VARCHAR(100) NOT NULL</text>
<text x="1074" y="200" font-size="13" fill="#222">style</text>
<text x="1215" y="200" font-size="12" fill="#555">VARCHAR(20) NOT NULL</text>
<rect x="1031" y="208" width="348" height="24" fill="#f4f6f8"/>
<text x="1074" y="224" font-size="13" fill="#222">level</text>
<text x="1215" y="224" font-size="12" fill="#555">VARCHAR(20) NOT NULL</text>
<text x="1074" y="248" font-size="13" fill="#222">instructor</text>
<text x="1215" y="248" font-size="12" fill="#555">VARCHAR(100) NOT NULL</text>
<rect x="1031" y="256" width="348" height="24" fill="#f4f6f8"/>
<text x="1074" y="272" font-size="13" fill="#222">start_time</text>
<text x="1215" y="272" font-size="12" fill="#555">TIMESTAMP NOT NULL</text>
<text x="1074" y="296" font-size="13" fill="#222">duration_minutes</text>
<text x="1215" y="296" font-size="12" fill="#555">INTEGER NOT NULL</text>
<rect x="1031" y="304" width="348" height="24" fill="#f4f6f8"/>
<text x="1074" y="320" font-size="13" fill="#222">capacity</text>
<text x="1215" y="320" font-size="12" fill="#555">INTEGER NOT NULL</text>
<text x="1074" y="344" font-size="13" fill="#222">min_age</text>
<text x="1215" y="344" font-size="12" fill="#555">INTEGER NOT NULL</text>
<rect x="1031" y="352" width="348" height="24" fill="#f4f6f8"/>
<text x="1074" y="368" font-size="13" fill="#222">price</text>
<text x="1215" y="368" font-size="12" fill="#555">NUMERIC(10,2) NOT NULL</text>
<text x="1030" y="402" font-size="11" fill="#666">CHECK: style IN (8 направлений), level IN (3 уровня)</text>
<text x="1030" y="417" font-size="11" fill="#666">duration 15..240, capacity 1..100, min_age 0..99, price &gt;= 0</text>
<path d="M380 148.0 H455.0 V142.0 H530" fill="none" stroke="#444" stroke-width="1.6"/>
<line x1="390" y1="140.0" x2="390" y2="156.0" stroke="#444" stroke-width="2"/>
<text x="394" y="140.0" font-size="12" fill="#222">1</text>
<path d="M530 142.0 L514 134.0 M530 142.0 L514 142.0 M530 142.0 L514 150.0" stroke="#444" stroke-width="1.6" fill="none"/>
<text x="508" y="166.0" font-size="12" fill="#222">N</text>
<text x="455.0" y="112.0" font-size="11" fill="#555" text-anchor="middle">fk_enrollments_client</text>
<path d="M1030 148.0 H955.0 V166.0 H880" fill="none" stroke="#444" stroke-width="1.6"/>
<line x1="1020" y1="140.0" x2="1020" y2="156.0" stroke="#444" stroke-width="2"/>
<text x="1008" y="140.0" font-size="12" fill="#222">1</text>
<path d="M880 166.0 L896 158.0 M880 166.0 L896 166.0 M880 166.0 L896 174.0" stroke="#444" stroke-width="1.6" fill="none"/>
<text x="888" y="190.0" font-size="12" fill="#222">N</text>
<text x="955.0" y="118.0" font-size="11" fill="#555" text-anchor="middle">fk_enrollments_class</text>
<text x="30" y="470" font-size="12" font-weight="bold" fill="#222">Обозначения:</text>
<text x="30" y="488" font-size="12" fill="#555">PK — первичный ключ, FK — внешний ключ (ON DELETE RESTRICT), UQ — UNIQUE, NOT NULL — обязательное поле.</text>
<text x="30" y="506" font-size="12" fill="#555">Связь «1 — N»: у одного клиента и у одного занятия может быть много записей; запись связывает ровно одного клиента и одно занятие.</text>
</svg>